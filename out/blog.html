TTP 协议\",\"description\":\"随着 Internet 的发展，使用 Web 浏览器获取网络数据信息已经成为一种习惯标准，而 HTTP 协议也因此成为了网络体系中最重要的应用层协议。\",\"date\":\"2018-06-24T14:59:00.000Z\",\"tags\":[\"计算机技术\",\"协议\",\"HTTP\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"protocol-ip\",\"title\":\"IP 协议\",\"description\":\"作为 TCP/IP 协议栈中最核心的协议，IP 协议为网络数据传输和网络互联提供最基本的服务。IP 协议有 IPv4 和 IPv6 两个版本，我们只讨论 TPv4 版本的 IP 协议。\",\"date\":\"2018-06-23T18:02:00.000Z\",\"tags\":[\"计算机技术\",\"协议\",\"IP\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"protocol-tcp-udp\",\"title\":\"TCP 与 UDP 协议\",\"description\":\"传输层是网络分层模型中举足轻重的层，它是底层通信子网与高层资源子网的接口与桥梁，提供了面向连接的传输控制协议（Transmission Control Protocol，TCP）和无连接的用户数据报协议（User Datagram Protocol，UDP），负责提供端到端的数据传输服务。\",\"date\":\"2018-06-20T17:21:00.000Z\",\"tags\":[\"计算机技术\",\"协议\",\"TCP\",\"UDP\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"protocol-lan-wan\",\"title\":\"局域网（LAN）与广域网（WAN）\",\"description\":\"TCP/IP 的网络接口层包括物理层和数据链路层，既是局域网（LAN）技术起作用的分层，又是广域网（WAN）技术和连接管理协议发挥作用的层次。\",\"date\":\"2018-06-18T18:22:00.000Z\",\"tags\":[\"计算机技术\",\"协议\",\"LAN\",\"WAN\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"protocol-base\",\"title\":\"网络通信关键概念\",\"description\":\"计算机网络是通过通信设备与线路将地理上分散并且具有独立功能的计算机系统连接在一起，并由功能完善的软件来控制，进而实现资源共享的系统。从物理组成上来看，计算机网络包括硬件、软件和协议三大部分。计算机网络中结点间相互通信是由控制信息传送的网络协议及其他相应的网络软件共同实现的。在计算机网络通信中，有部分\",\"date\":\"2018-06-18T16:17:00.000Z\",\"tags\":[\"计算机技术\",\"协议\",\"关键概念\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"protocol-osi\",\"title\":\"OSI 与 TCP/IP 参考模型\",\"description\":\"目前流行的两大网络体系结构是 OSI/RM 和 TCP/IP 参考模型，他们均是分层结构。分层是为了简化问题，降低网络设计复杂性，而且各层次结构相互独立，实现的功能也相对独立。层与层之间只在层间接口处关联，层间耦合最小。\",\"date\":\"2018-06-17T17:39:00.000Z\",\"tags\":[\"计算机技术\",\"协议\",\"OSI\",\"TCP/IP\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"web-local-storage\",\"title\":\"Web 本地存储\",\"description\":\"为了达到某些需求，我们通常需要在本地存储一些数据，方便我们进行用户个性化定制服务。\",\"date\":\"2018-06-01T01:00:00.000Z\",\"tags\":[\"计算机技术\",\"Web前端\",\"Cookie\",\"LocalStorage\",\"SessionStorage\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-js\",\"title\":\"DOM-加载 JavaScript\",\"description\":\"页面的动态交互离不开 Javascript，将 js 脚本引入页面时会阻塞页面加载，在某些时候我们则可以选择异步加载 js 脚本。\",\"date\":\"2018-05-24T22:49:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"JavaScript\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-textnode\",\"title\":\"DOM-文本节点\",\"description\":\"文本（Text）节点虽然很多时候我们直接用 innerHTML 去赋值替换，但当我们进行一些细微的修改时，了解一下 DOM 操作还是非常有用的。\",\"date\":\"2018-05-24T21:50:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-fragment\",\"title\":\"DOM-文档片段\",\"description\":\"DOM 操作是非常消耗性能的，如果要进行大量的 DOM 操作，我们可以选择在内存中先构建一个文档片段然后一次性插入 DOM 树。\",\"date\":\"2018-05-23T13:10:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"Fragment\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-event\",\"title\":\"DOM-事件\",\"description\":\"JavaScript 的作用就是让 html 静态页面具备动态效果，而这些基本都是利用 DOM 事件来实现的。\",\"date\":\"2018-05-23T12:18:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"Event\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-attribute\",\"title\":\"DOM-元素节点属性\",\"description\":\"元素节点上具有很多属性，这些属性我们通常可以很方便的获取，并进行简单的操作。\",\"date\":\"2018-05-21T21:00:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"Attribute\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"css-clear-float\",\"title\":\"CSS 清除浮动\",\"description\":\"在浮动布局中，有时候会因为父元素没有设置高度而子元素浮动导致父元素坍塌，我们就需要清除浮动撑起父元素的高度，在这里总结一下常用方法。\",\"date\":\"2018-05-21T18:25:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"CSS\",\" Float\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-rule\",\"title\":\"DOM-元素节点几何量\",\"description\":\"当我们在查看 HTML 文档时，每个元素节点被解析后，都画成了可视形状。我们可以获取每个元素节点的几何量（宽、高、偏移量）以及页面滚动距离。\",\"date\":\"2018-05-19T14:54:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"Rule\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"tools-sublime\",\"title\":\"编辑器：Sublime Text 常用插件\",\"description\":\"Sumblime Text 是一个具有漂亮的界面和强大功能的文本编辑器，而且也支持许多丰富的插件。它是一个收费软件，但是允许开发人员无限期的免费试用。这篇文章介绍一下常用的插件。\",\"date\":\"2018-05-19T13:38:00.000Z\",\"tags\":[\"计算机技术\",\"工具\",\"编辑器\",\"Sublime Text\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"tools-sublime-vim\",\"title\":\"编辑器：Sublime Text - Vim 插件\",\"description\":\"Sumblime Text 是一个具有漂亮的界面和强大功能的文本编辑器，而且也支持许多丰富的插件。它是一个收费软件，但是允许开发人员无限期的免费试用。\",\"date\":\"2018-05-18T12:55:00.000Z\",\"tags\":[\"Sublime TextVim工具插件编辑器\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-nodelist\",\"title\":\"DOM-节点集合\",\"description\":\"当从文档树中选取成组的节点或者使用预定义的节点集合时，这些节点都是放在 NodeList 或者一个 HTMLCollecton 之中，而不是一个数组（Array）中。\",\"date\":\"2018-05-17T22:30:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"NodeList\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-select\",\"title\":\"DOM-选取元素节点\",\"description\":\"DOM 操作都是通过对文档树中节点的访问来实现的，如何选取特定的元素节点是关键，进而才能访问该元素节点实现修改、查看、移除、替换等操作。\",\"date\":\"2018-05-17T22:10:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"Selector\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-elementnode\",\"title\":\"DOM-元素节点\",\"description\":\"可以说，元素节点是 DOM 树中的核心部分，我们进行文档的操作通常都是建立在元素节点上的。\",\"date\":\"2018-05-17T13:19:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"Element Node\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom\",\"title\":\"文档对象模型（DOM）\",\"description\":\"在网页设计中，有一个很重要的角色需要我们了解，DOM 帮助我们对页面元素进行增、删、改等全方位的操作，而且让 JavaScript 在客户端修改 HTML 文档成为一个很简单的事情，可以说 DOM 为我们操作 HTML 文档提供了强大的编程接口。\",\"date\":\"2018-05-16T14:04:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"dom-bom\",\"title\":\"浏览器对象模型（BOM）\",\"description\":\"在网页开发中，我们通常专注于内容的设计，而有些时候我们需要进行不同窗口之间的交互，这时候我们就需要学习如何运用 BOM 中的许多核心对象，及其属性、方法。\",\"date\":\"2018-05-15T12:02:00.000Z\",\"tags\":[\"计算机技术\",\"Web\",\"Web 前端\",\"DOM\",\"BOM\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"computer-cpu-addressing-mode\",\"title\":\"CPU 的七种寻址方式\",\"description\":\"CPU 获取数据的方式不仅仅一种，多种方式也为不同数据的获取提供了不同的效率考量，保证了寻址效率与指令的灵活性。\",\"date\":\"2018-05-05T01:53:00.000Z\",\"tags\":[\"计算机技术\",\"CPU\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"computer-memory-refresh\",\"title\":\"内存的 3 种刷新方式\",\"description\":\"内存为我们提供了一个数据快速交换的缓冲区，但同时会在掉电的情况下数据丢失，来看看内存是如何在带电情况下刷新数据的。\",\"date\":\"2018-05-03T01:59:00.000Z\",\"tags\":[\"计算机技术\",\"内存\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"computer-microprocessor-addressing-range\",\"title\":\"微处理器寻址范围\",\"description\":\"为什么内存不是越大越好，内存的大小受限于处理器的寻址范围。\",\"date\":\"2018-04-28T01:42:00.000Z\",\"tags\":[\"计算机技术\",\"计算机\",\"MPU\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"linux-cmd-vim\",\"title\":\"Linux-Vim 编辑器\",\"description\":\"在 Linux 这样的命令行操作系统中，必须有一款功能强大的编辑器支持我们快速完成文本编辑，这就是 Vi 编辑器；通过对其加强和升级，Vim 编辑器比前者更为强大，拥有更多的功能和颜色高亮的特性，是程序员在 Linux 下编码的利器。\",\"date\":\"2018-04-27T21:02:00.000Z\",\"tags\":[\"计算机技术计算机Linux\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"web-front-end-architecture\",\"title\":\"Web 前端架构设计\",\"description\":\"Web 前端开发是一个零散化的过程，基本上没有专业的 IDE 来为我们提供一整套的自动化流程解决方案，如何从需求到实现一步步快速推进形成完整的工作流，在后期如何高效的进行测试和优化，让前端开发可持续化、可扩展显得极为重要。\",\"date\":\"2018-03-28T14:01:00.000Z\",\"tags\":[\"计算机技术\",\"Web前端\",\"程序架构设计\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"nginx-config\",\"title\":\"Nginx 配置\",\"description\":\"Nginx 作为一个轻量、高性能的服务器，近年来颇受欢迎，无论是生产环境还是开发环境都有其发挥作用的地方，其配置文件相对来说还是较为简单的。而且，现在nginx 也支持 Windows 环境了，利用不同的配置可以满足我们不同的需求。\",\"date\":\"2018-03-15T12:38:00.000Z\",\"tags\":[\"计算机技术\",\"服务器\",\"Nginx\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"linux-cmd-shell\",\"title\":\"Linux-常用 Shell 命令\",\"description\":\"Linux 是一个优秀的开发环境，大多数服务器都在上面部署。作为一个程序员，熟悉Linux 系统的常用操作也是很必要的。在 linux 内核外，shell 提供了我们程序员（用户）与内核之间的交互媒介，shell 可以说是一个命令解释器，当然它也负责将内核输出信息翻译给程序员。\",\"date\":\"2018-02-21T21:02:00.000Z\",\"tags\":[\"计算机技术操作系统Linux\"],\"category\":\"tech\",\"draft\":false},{\"slug\":\"web-routing\",\"title\":\"Web 应用：单页面应用与路由\",\"description\":\"现在，Web 技术不仅仅是局限于
